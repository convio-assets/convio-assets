<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Denied | Convio</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#FFF3D9">
  <style>
    :root {
      --cream: #FFF3D9;
      --off-white: #FFF9EE;
      --brown: #564E3B;
      --muted: #8C7E63;
      --faint: #B8A98C;
      --hover: #3D3729;
      --line: rgba(86, 78, 59, 0.14);
      --shadow: 0 18px 60px rgba(86, 78, 59, 0.13);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.38), transparent 34%),
        var(--cream);
      color: var(--brown);
      font-family: "DM Sans", "Aptos", "Segoe UI", Arial, Helvetica, sans-serif;
    }

    .page-shell {
      width: min(100%, 720px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 18px 8px;
      color: var(--brown);
      text-decoration: none;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--brown);
      color: var(--cream);
      font-family: "Manrope", "Avenir Next", "Segoe UI", Arial, sans-serif;
      font-size: 30px;
      font-weight: 500;
      line-height: 1;
    }

    .brand-wordmark {
      font-family: "Manrope", "Avenir Next", "Segoe UI", Arial, sans-serif;
      font-size: 27px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: .28em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: clamp(32px, 6vw, 58px);
      background: var(--off-white);
      border: 1px solid var(--line);
      border-radius: 30px;
      box-shadow: var(--shadow);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 6px;
      background: var(--brown);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--faint);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 560px;
      font-family: "Manrope", "Avenir Next", "Segoe UI", Arial, sans-serif;
      font-size: clamp(38px, 8vw, 62px);
      font-weight: 500;
      line-height: .98;
      letter-spacing: -.04em;
      color: var(--brown);
    }

    .divider {
      width: 100%;
      height: 1px;
      margin: 28px 0;
      background: var(--line);
    }

    .copy {
      max-width: 580px;
      font-size: 16px;
      line-height: 1.75;
    }

    .copy p {
      margin: 0 0 14px;
    }

    .copy p:last-child {
      margin-bottom: 0;
    }

    .copy a {
      color: var(--brown);
      font-weight: 700;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
    }

    .copy a:hover { color: var(--hover); }

    .actions {
      margin-top: 32px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 13px 20px;
      border-radius: 12px;
      background: var(--brown);
      color: var(--cream);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(86,78,59,.14);
      transition: background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .button:hover {
      background: var(--hover);
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(86,78,59,.18);
    }

    .button:focus-visible,
    .brand:focus-visible,
    .copy a:focus-visible {
      outline: 3px solid rgba(86,78,59,.28);
      outline-offset: 4px;
    }

    .footer-note {
      margin: 18px 8px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 520px) {
      body { padding: 22px 14px; }
      .brand { margin-left: 4px; }
      .brand-mark {
        width: 42px;
        height: 42px;
        font-size: 27px;
      }
      .brand-wordmark {
        font-size: 23px;
        letter-spacing: .24em;
      }
      .card { border-radius: 24px; }
      .button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
      .button:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main class="page-shell" aria-labelledby="access-denied-title">
    <a class="brand" href="https://convio.io/" aria-label="Return to Convio">
      <span class="brand-mark" aria-hidden="true">C</span>
      <span class="brand-wordmark">CONVIO</span>
    </a>

    <section class="card">
      <p class="eyebrow">Private Convio page</p>
      <h1 id="access-denied-title">Access Denied</h1>

      <div class="divider" aria-hidden="true"></div>

      <div class="copy">
        <p>You do not have access to this private Convio page.</p>
        <p>
          If you believe you should have access, please
          <a href="mailto:hello@convio.io">contact Convio</a>.
        </p>
      </div>

      <div class="actions">
        <a class="button" href="https://convio.io/">Return to Convio</a>
      </div>
    </section>

    <p class="footer-note">Convio | Growth and marketing for growing businesses</p>
  </main>
</body>
</html>
